name: Promote reviewed production web

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed main commit SHA (must equal this run's main SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: community-production-promotion
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.digest }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - name: Require the explicitly reviewed main SHA
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.6.2 --no-audit --no-fund
      - run: npm ci --workspaces --include-workspace-root=false --no-audit --no-fund
      - run: npm run lint --workspace @rct/community-infra
      - run: npm run check:foundation
      - run: node packages/contracts/src/verify-pin.ts
      - run: npm audit --workspaces --include-workspace-root=false --audit-level=high
      - run: npm run build:web
        env:
          VITE_COMMUNITY_PRESENTATION: production
          VITE_COMMUNITY_BRAND_LAUNCH_APPROVED: "true"
          VITE_COMMUNITY_INTERNAL_ENABLED: "false"
      - name: Freeze the single tested production candidate
        id: manifest
        run: |
          mkdir -p release
          cp -R apps/web/dist release/candidate
          digest=$(node infra/src/web-candidate.ts create release/candidate release/manifest.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: production-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - name: Record immutable candidate
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          printf 'Reviewed SHA: %s\nArtifact ID: %s\nArtifact digest: %s\nManifest SHA-256: %s\n' \
            "$GITHUB_SHA" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$MANIFEST_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  development:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    concurrency:
      group: web-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ENVIRONMENT: development
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "425061472162"
      AWS_WEB_PUBLISH_ROLE_ARN: ${{ vars.AWS_WEB_PUBLISH_ROLE_ARN }}
      AWS_PAGER: ""
      CANDIDATE_DIGEST: ${{ needs.candidate.outputs.manifest_digest }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: release
          merge-multiple: true
      - run: |
          node infra/src/check-web-release.ts environment
          node infra/src/web-candidate.ts verify release/candidate release/manifest.json "$CANDIDATE_DIGEST" "$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_WEB_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: "425061472162"
          role-duration-seconds: 1800
          mask-aws-account-id: true
      - name: Stage and verify the production bytes in development
        run: bash infra/scripts/promote-web.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: development-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/verification/provenance.txt
            release/verification/previous-index.html
          if-no-files-found: warn
          retention-days: 90

  production:
    needs: [candidate, development]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: web-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_ENVIRONMENT: production
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "425061472162"
      AWS_WEB_PUBLISH_ROLE_ARN: ${{ vars.AWS_WEB_PUBLISH_ROLE_ARN }}
      AWS_PAGER: ""
      CANDIDATE_DIGEST: ${{ needs.candidate.outputs.manifest_digest }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: release
          merge-multiple: true
      - run: |
          node infra/src/check-web-release.ts environment
          node infra/src/web-candidate.ts verify release/candidate release/manifest.json "$CANDIDATE_DIGEST" "$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_WEB_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: "425061472162"
          role-duration-seconds: 1800
          mask-aws-account-id: true
      - name: Promote and verify the exact development-tested bytes without rebuilding
        run: bash infra/scripts/promote-web.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/verification/provenance.txt
            release/verification/previous-index.html
          if-no-files-found: warn
          retention-days: 90
